<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071311">
    <meta name="description" content="Ngomikgeng — baca manga, manhwa, dan manhua favoritmu dengan pengalaman membaca yang ringan dan nyaman.">
    <meta property="og:title" content="Ngomikgeng — Baca Komik Favoritmu">
    <meta property="og:description" content="Jelajahi manga, manhwa, dan manhua terbaru di Ngomikgeng.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <title>Ngomikgeng — Baca Komik Favoritmu</title>
    <link rel="preconnect" href="https://komiku.online" crossorigin>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar">
        <a class="brand" href="#/home" aria-label="Ngomikgeng beranda">
          <span class="brand-mark"><i data-lucide="book-open"></i></span>
          <span>ngomik<span>geng</span></span>
        </a>
        <div class="top-actions">
          <button class="icon-btn" id="topSearch" aria-label="Cari komik"><i data-lucide="search"></i></button>
          <button class="icon-btn" id="themeToggle" aria-label="Ganti tema"><i data-lucide="sun-moon"></i></button>
        </div>
      </header>
      <main id="app" tabindex="-1">
        <section class="loading-screen">
          <span class="loader"></span>
          <p>Menyiapkan dunia komikmu...</p>
        </section>
      </main>
      <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi utama">
        <a href="#/home" data-nav="home" class="nav-item active">
          <i data-lucide="house"></i><span>Beranda</span>
        </a>
        <a href="#/search" data-nav="search" class="nav-item">
          <i data-lucide="search"></i><span>Search</span>
        </a>
        <a href="#/favorites" data-nav="favorites" class="nav-item">
          <i data-lucide="heart"></i><span>Favorite</span><b class="nav-count" id="favoriteCount">0</b>
        </a>
        <a href="#/history" data-nav="history" class="nav-item">
          <i data-lucide="history"></i><span>Riwayat</span>
        </a>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
